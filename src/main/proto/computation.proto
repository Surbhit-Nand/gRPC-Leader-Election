syntax = "proto3";
package distrilab.computation;
option java_package = "com.cs324.computation.proto";
option java_multiple_files = true;

// Member 3 contract: no Java serialization or remote callback objects.
service TaskService {
  rpc ExecuteTask(TaskRequest) returns (TaskResult);
}
service JobService {
  rpc SubmitJob(JobRequest) returns (stream JobUpdate);
}
enum JobType {
  JOB_TYPE_UNSPECIFIED = 0;
  MAX = 1;
  PRIMESUM = 2;
  PRIMECOUNT = 3;
}
message Numbers { repeated sint32 values = 1; }
message PrimeRange { sint32 start = 1; sint32 end = 2; }
message WorkInput {
  oneof input {
    Numbers numbers = 1;
    PrimeRange range = 2;
  }
}
message JobRequest {
  // Client-generated UUID: different clients must not share a job ID.
  string job_id = 1;
  JobType type = 2;
  WorkInput input = 3;
}
message TaskRequest {
  string job_id = 1;
  string task_id = 2;
  JobType type = 3;
  WorkInput input = 4;
}
message TaskResult {
  string job_id = 1;
  string task_id = 2;
  int32 worker_id = 3;
  sint64 value = 4;
}
message TaskProgress {
  string task_id = 1;
  int32 worker_id = 2;
  int64 total_units = 3;
  int64 completed_units = 4;
  bool completed = 5;
}
message JobUpdate {
  string job_id = 1;
  repeated TaskProgress tasks = 2;
  bool finished = 3;
  // Present only on the final successful update, including a zero result.
  optional sint64 result = 4;
}
