// Heartbeat, replication and recovery RPCs served by every worker.
syntax = "proto3";
package distrilab;
option java_package = "com.cs324.failover.proto";
option java_multiple_files = true;

import "job.proto";
import "registry.proto";

// Coordinator liveness and re-discovery. Held by every worker; the follower sends it to the coordinator it currently believes in.
service FailoverService {
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatReply);
  rpc Replicate(ReplicateRequest) returns (ReplicateAck);
  rpc FetchCheckpoints(FetchRequest) returns (FetchReply);
}

message HeartbeatRequest {
  // The sender, so the responder can tell a follower from a peer asking who leads.
  int32 worker_id = 1;
  // The sender's view of the current generation; lets both sides notice drift.
  int64 term = 2;
  int32 coordinator_id = 3;
}

message HeartbeatReply {
  // Responder's leadership generation and who it believes leads. A follower that sees a higher term re-discovers instead of electing.
  int64 term = 1;
  int32 coordinator_id = 2;
  bool is_coordinator = 3;
}

// Preserve each slice input and result so recovery can rebuild the original split.
message SliceState {
  int32 task_id = 1;
  TaskPayload input = 2;
  WorkerEndpoint owner = 3;
  int32 attempt = 4;
  TaskResult result = 5;
}

// Keep the original request so recovery can recognize duplicate submissions.
message JobAccepted {
  SubmitJobRequest request = 1;
  repeated SliceState slices = 2;
  // Preserve the acceptance time so recovery can calculate the remaining deadline.
  int64 accepted_at_millis = 3;
}

// A missing owner or result, or a zero attempt, leaves that slice field unchanged.
message SliceUpdated {
  int32 task_id = 1;
  WorkerEndpoint owner = 2;
  int32 attempt = 3;
  TaskResult result = 4;
}

// A terminal marker prevents recomputation and retains the result for callback retries.
message JobFinished {
  TaskResult result = 1;
  // True once the client callback for that result was acknowledged.
  bool delivered = 2;
}

// The job changed hands: the coordinator that rebuilt it owns it from now on.
message JobClaimed {
  // The worker that owns the job from now on.
  int32 coordinator_id = 1;
  // The term in which it took ownership; a newer term supersedes an older claim.
  int64 term = 2;
}

// Per-job sequence numbers reject duplicate and out-of-order checkpoint entries.
message CheckpointEntry {
  int32 job_id = 1;
  int64 sequence = 2;
  // Reject checkpoint writes from a coordinator in an older term.
  int64 term = 3;
  int32 coordinator_id = 4;
  oneof entry {
    JobAccepted accepted = 5;
    SliceUpdated slice = 6;
    JobFinished finished = 7;
    JobClaimed claimed = 8;
  }
}

message ReplicateRequest {
  int32 coordinator_id = 1;
  int64 term = 2;
  repeated CheckpointEntry entries = 3;
}

message ReplicateAck {
  // Highest sequence stored by the peer; acceptance requires confirmation of the submitted sequence.
  int64 acknowledged_sequence = 1;
}

message FetchRequest {
  int32 requester_id = 1;
}

message FetchReply {
  int32 replica_id = 1;
  repeated CheckpointEntry entries = 2;
}