// Coordinator-failure contract (Member 2). A new file, so no field number or
// RPC in registry/election/job/progress is touched.
//
// Why these three RPCs and no others:
//
// - Heartbeat: failure detection has to ask a question the RPC answer alone
//   cannot settle. A timed-out probe is indistinguishable from a slow peer, so
//   the reply carries the responder's (term, coordinator_id, is_coordinator).
//   That is what separates "this coordinator is busy" from "this coordinator has
//   been deposed and I am talking to a zombie", and it doubles as re-discovery:
//   a follower that hears a higher term asks peers instead of starting a wave.
// - Replicate: a coordinator that accepts a job and dies takes the job with it.
//   Accepted state is therefore written to the peers before the client is
//   acknowledged, and slice/finish transitions follow as they happen.
// - FetchCheckpoints: takeover is a read. Merging is per job sequence, so a
//   survivor can ask every reachable peer and keep the newest view of each job.
//
// Payloads stay inspectable: no opaque bytes blobs, every field is readable in a
// log line or a test assertion.
syntax = "proto3";
package distrilab;
option java_package = "com.cs324.failover.proto";
option java_multiple_files = true;

import "job.proto";
import "registry.proto";

// Coordinator liveness and re-discovery. Held by every worker; the follower
// sends it to the coordinator it currently believes in.
service FailoverService {
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatReply);
  rpc Replicate(ReplicateRequest) returns (ReplicateAck);
  rpc FetchCheckpoints(FetchRequest) returns (FetchReply);
}

message HeartbeatRequest {
  // The sender, so the responder can tell a follower from a peer asking who leads.
  int32 worker_id = 1;
  // The sender's view of the current generation; lets both sides notice drift.
  int64 term = 2;
  int32 coordinator_id = 3;
}

message HeartbeatReply {
  // Responder's leadership generation and who it believes leads. A follower that
  // sees a higher term re-discovers instead of electing.
  int64 term = 1;
  int32 coordinator_id = 2;
  bool is_coordinator = 3;
}

// One slice as the coordinator accepted it. The payload travels so a survivor can
// rebuild the split without re-deriving it, which is what keeps a reassigned
// slice worth exactly the same as the original. Accepted slices are never
// started yet: the delta below carries every later transition, and result
// appears only in a snapshot taken by FetchCheckpoints.
message SliceState {
  int32 task_id = 1;
  TaskPayload input = 2;
  WorkerEndpoint owner = 3;
  int32 attempt = 4;
  TaskResult result = 5;
}

// A job the coordinator accepted. Carries the original SubmitJobRequest so a
// survivor can acknowledge a client resubmission instead of running it twice.
message JobAccepted {
  SubmitJobRequest request = 1;
  repeated SliceState slices = 2;
  // Coordinator wall clock at acceptance, so the restored job keeps the deadline
  // it would have had rather than silently gaining a fresh full one.
  int64 accepted_at_millis = 3;
}

// A delta on one slice. Absent fields mean "unchanged", so a small update stays
// small: worker_id 0 = no owner change, attempt 0 = no attempt change, unset
// result = still running.
message SliceUpdated {
  int32 task_id = 1;
  WorkerEndpoint owner = 2;
  int32 attempt = 3;
  TaskResult result = 4;
}

// Tombstone. A job that reached a result must not be rebuilt, and its client
// callback may still need replaying, so the final result travels with it.
message JobFinished {
  TaskResult result = 1;
  // True once the client callback for that result was acknowledged.
  bool delivered = 2;
}

// One append-only log entry. Per-job sequence numbers make folding idempotent:
// a duplicate or an out-of-order arrival is ignored rather than applied twice.
message CheckpointEntry {
  int32 job_id = 1;
  int64 sequence = 2;
  // Leadership generation that produced the entry, for diagnostics and for
  // rejecting a write from a coordinator that has already been deposed.
  int64 term = 3;
  int32 coordinator_id = 4;
  oneof entry {
    JobAccepted accepted = 5;
    SliceUpdated slice = 6;
    JobFinished finished = 7;
  }
}

message ReplicateRequest {
  int32 coordinator_id = 1;
  int64 term = 2;
  repeated CheckpointEntry entries = 3;
}

message ReplicateAck {
  // Highest per-job sequence this replica holds, so the sender can resend only
  // what is genuinely missing instead of replaying its whole log.
  int64 acknowledged_sequence = 1;
}

message FetchRequest {
  int32 requester_id = 1;
}

message FetchReply {
  int32 replica_id = 1;
  repeated CheckpointEntry entries = 2;
}