syntax = "proto3";
package distrilab;
option java_package = "com.cs324.control.proto";
option java_multiple_files = true;

// Peer topology and client monitoring. No serialized Java objects cross this API.
service WorkerControlService {
  rpc GetStatus(StatusRequest) returns (WorkerStatus);
  rpc ConnectPeer(ConnectPeerRequest) returns (ControlAck);
  rpc NotifyLeaving(LeavingRequest) returns (ControlAck);
  rpc StartElection(ControlAck) returns (StartElectionReply);
}
message ControlAck {}
message StatusRequest { int64 after_sequence = 1; }
message WorkerStatus {
  int32 worker_id = 1;
  int32 coordinator_id = 2;
  int64 term = 3;
  int32 jac = 4;
  repeated int32 neighbour_ids = 5;
  repeated ClusterEvent events = 6;
  int32 grpc_port = 7;
}
message ClusterEvent {
  int64 sequence = 1;
  int32 worker_id = 2;
  int64 epoch_millis = 3;
  string kind = 4;
  string detail = 5;
}
message ConnectPeerRequest { int32 worker_id = 1; }
message LeavingRequest { int32 worker_id = 1; repeated int32 neighbour_ids = 2; }
message StartElectionReply { int64 message_id = 1; }
