// Bootstrap discovery; worker RPCs use host and grpc_port, while port is compatibility metadata.
syntax = "proto3";
package distrilab;
option java_package = "com.cs324.registry.proto";
option java_multiple_files = true;

service RegistryService {
  // One atomic call: allocate (or claim) the id, record the address, return a peer.
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Deregister(DeregisterRequest) returns (DeregisterResponse);
  rpc AllocateJobId(AllocateJobIdRequest) returns (AllocateJobIdResponse);
  rpc GetActiveWorkers(GetActiveWorkersRequest) returns (GetActiveWorkersResponse);
  rpc GetWorkerAddress(GetWorkerAddressRequest) returns (GetWorkerAddressResponse);
}

// Contact point of one worker as published by the directory.
message WorkerEndpoint {
  int32 worker_id = 1;
  string host = 2;
  int32 port = 3;
  // JobService and JobProgressService port; zero until the worker is ready.
  int32 grpc_port = 4;
}

message RegisterRequest {
  // Ignored when auto_assign is true; claimed when false.
  int32 worker_id = 1;
  string host = 2;
  int32 port = 3;
  // Allocate an ID when true; otherwise claim the supplied worker_id.
  bool auto_assign = 4;
  int32 grpc_port = 5;
  // Publish the listener for an existing identity with matching host and contact port.
  bool update_endpoint = 6;
}

message RegisterResponse {
  int32 worker_id = 1;
  // False means this worker is first: peer is unset, nothing to join.
  bool has_peer = 2;
  WorkerEndpoint peer = 3;
}

message DeregisterRequest {
  int32 worker_id = 1;
}

message DeregisterResponse {}

message AllocateJobIdRequest {}

message AllocateJobIdResponse {
  int32 job_id = 1;
}

message GetActiveWorkersRequest {}

message GetActiveWorkersResponse {
  repeated int32 worker_ids = 1;
}

message GetWorkerAddressRequest {
  int32 worker_id = 1;
}

message GetWorkerAddressResponse {
  // False means unknown (deregistered or never registered): worker is unset.
  bool found = 1;
  WorkerEndpoint worker = 2;
}
